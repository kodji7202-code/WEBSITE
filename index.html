      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Fonts with display=swap to prevent invisible text -->
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Oswald:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
