
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicSphere AI - Producer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Oswald:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#FF2E2E',
                        secondary: '#6B6B6B',
                        dark: '#0B0B0E',
                        'dark-soft': '#16161a', // Keeping soft dark for contrast
                        'dark-card': '#1f1f23'
                    },
                    fontFamily: {
                        sans: ['Oswald', 'sans-serif'], // Default for "other sections" (Druk Condensed alt)
                        wide: ['Syncopate', 'sans-serif'], // Hero (Druk Wide alt)
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0B0E;
            color: #F2F2F2;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(22, 22, 26, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f1f23;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2d2d35;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
