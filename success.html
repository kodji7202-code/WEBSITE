<!DOCTYPE html>
<html lang="ro" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - SonicSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#a855f7',
                        dark: '#0a0a0c',
                        'dark-soft': '#16161a',
                        'dark-card': '#1f1f23'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a0a0c;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .glow-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .checkmark-anim {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: dash 0.8s ease-in-out forwards;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.2);
            border-radius: 10px;
        }

        .download-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .download-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .download-btn:hover::after {
            left: 100%;
        }

        /* Loading Spinner */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-left-color: #fff;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="glow-bg"></div>

    <div class="relative z-10 w-full max-w-2xl px-6 text-center">
        <!-- Success Icon -->
        <div
            class="inline-flex items-center justify-center w-24 h-24 mb-8 bg-green-500/10 rounded-full border border-green-500/20 shadow-[0_0_50px_rgba(34,197,94,0.15)]">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="checkmark-anim">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <div class="fade-in">
            <h1 class="text-4xl md:text-6xl font-black uppercase italic tracking-tighter text-white mb-4">
                Order Complete
            </h1>

            <p id="status-text" class="text-gray-400 text-lg font-medium mb-12 px-4">
                Verifying order details...
            </p>

            <!-- Container Lista Produse -->
            <div id="downloads-list"
                class="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar text-left mb-8">
                <!-- Aici se vor genera butoanele -->
            </div>

            <div id="auto-dl-message" class="opacity-0 transition-opacity duration-700">
                <p class="text-[11px] text-primary font-black uppercase tracking-[0.25em] animate-pulse">
                    Downloading first file automatically...
                </p>
            </div>
        </div>

        <div class="mt-16 pt-8 border-t border-white/5 fade-in" style="animation-delay: 0.5s">
            <a href="/"
                class="text-gray-500 hover:text-white text-xs font-black uppercase tracking-[0.3em] transition-all flex items-center justify-center gap-2 group">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                    class="group-hover:-translate-x-1 transition-transform">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Store
            </a>
        </div>
    </div>

    <script>
        // Project Configuration
        const SUPABASE_PROJECT_URL = "https://ncqaiywmkxcwfqnszldf.supabase.co";

        async function downloadFile(url, filename, btnId = null) {
            const btn = btnId ? document.getElementById(btnId) : null;
            let originalContent = '';

            try {
                if (btn) {
                    originalContent = btn.innerHTML;
                    btn.innerHTML = '<span class="spinner"></span> PREPARING...';
                    btn.style.opacity = '0.7';
                    btn.style.pointerEvents = 'none';
                }

                // 1. Fetch file as Blob
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network error');

                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();

                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);

                if (btn) {
                    btn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        SUCCESS
                    `;
                    setTimeout(() => {
                        btn.innerHTML = originalContent;
                        btn.style.opacity = '1';
                        btn.style.pointerEvents = 'auto';
                    }, 3000);
                }

            } catch (error) {
                console.error("Download failed via Blob", error);
                // Fallback for signed URLs (opening in new tab might work if token is in URL)
                window.open(url, '_blank');

                if (btn) {
                    btn.innerHTML = 'OPENED IN TAB';
                    setTimeout(() => {
                        btn.innerHTML = originalContent;
                        btn.style.opacity = '1';
                        btn.style.pointerEvents = 'auto';
                    }, 2000);
                }
            }
        }

        window.onload = async function () {
            const listContainer = document.getElementById('downloads-list');
            const autoDlMsg = document.getElementById('auto-dl-message');
            const statusText = document.getElementById('status-text');

            // 1. Get Session ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');

            if (!sessionId) {
                statusText.innerText = "No payment session detected.";
                listContainer.innerHTML = `
                    <div class="p-6 bg-red-500/10 border border-red-500/20 rounded-2xl text-center">
                        <p class="text-red-400 font-bold mb-2 uppercase tracking-widest text-sm">Access Denied</p>
                        <p class="text-xs text-gray-500">Please contact support if you think this is an error.</p>
                        <a href="/" class="inline-block mt-4 text-xs font-bold text-white underline">Return Home</a>
                    </div>
                `;
                return;
            }

            // 2. Call Secure Download Function
            try {
                const response = await fetch(`${SUPABASE_PROJECT_URL}/functions/v1/secure-download`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                        // No Authorization header needed if function handles verification via session_id,
                        // BUT Supabase Functions usually verify JWT. 
                        // We might need to handle this. For now assuming "No Verify" deploy or passing Anon Key if we had it.
                        // Actually, better to deploy with --no-verify-jwt to allow public call (data is protected by session_id).
                    },
                    body: JSON.stringify({ session_id: sessionId })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Validation failed');
                }

                const data = await response.json();
                const items = data.files || [];

                if (items.length === 0) {
                    throw new Error('No files found for this order.');
                }

                // 3. Render Items
                statusText.innerText = `Verified. You have ${items.length} files ready.`;

                items.forEach((item, index) => {
                    const displayName = item.name.replace(/_/g, ' ');

                    let extension = 'mp3';
                    if (item.license && (item.license.toLowerCase().includes('wav') || item.license.toLowerCase().includes('unlimited'))) {
                        extension = 'wav';
                    }
                    if (item.license === 'soundkit' || item.license === 'KIT') {
                        extension = 'zip';
                    }

                    const filename = `${item.name}.${extension}`;
                    const downloadUrl = item.downloadUrl; // This is the SIGNED URL
                    const btnId = `dl-btn-${index}`;

                    const row = document.createElement('div');
                    row.className = "w-full p-5 bg-dark-card border border-white/5 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4 group hover:border-primary/30 transition-all shadow-lg";

                    row.innerHTML = `
                        <div class="flex items-center gap-4 w-full md:w-auto overflow-hidden">
                            <div class="w-12 h-12 rounded-lg bg-white/5 flex items-center justify-center flex-shrink-0 text-primary">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                            </div>
                            <div class="min-w-0">
                                <h3 class="text-sm font-black uppercase tracking-tight text-white truncate">${displayName}</h3>
                                <p class="text-[10px] text-gray-500 font-mono font-bold uppercase tracking-widest">${item.license || 'LICENSE'}</p>
                            </div>
                        </div>
                        
                        <button 
                            id="${btnId}"
                            onclick="downloadFile('${downloadUrl}', '${filename}', '${btnId}')"
                            class="download-btn w-full md:w-auto px-8 py-3 bg-white text-dark font-black uppercase tracking-[0.2em] text-[10px] rounded-xl flex items-center justify-center gap-2 hover:bg-primary hover:text-white shadow-xl active:scale-95 transition-all"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            DOWNLOAD
                        </button>
                    `;
                    listContainer.appendChild(row);
                });

                // Auto download first
                if (items.length > 0) {
                    autoDlMsg.style.opacity = '1';
                    const first = items[0];
                    let ext = 'mp3';
                    if (first.license && (first.license.toLowerCase().includes('wav') || first.license.toLowerCase().includes('unlimited'))) ext = 'wav';
                    if (first.license === 'soundkit' || first.license === 'KIT') ext = 'zip';

                    setTimeout(() => {
                        downloadFile(first.downloadUrl, `${first.name}.${ext}`, 'dl-btn-0');
                    }, 1500);
                }

            } catch (err) {
                console.error("Verification error:", err);
                statusText.innerText = "Verification failed.";
                listContainer.innerHTML = `
                    <div class="p-6 bg-red-500/10 border border-red-500/20 rounded-2xl text-center">
                        <p class="text-red-400 font-bold mb-2 uppercase tracking-widest text-sm">Error</p>
                        <p class="text-xs text-gray-500">${err.message}</p>
                        <p class="text-[10px] text-gray-600 mt-2">ID: ${sessionId || 'N/A'}</p>
                    </div>
                `;
            }
        }
    </script>
</body>

</html>
